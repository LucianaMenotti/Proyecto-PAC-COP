<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Alertas - Prestador</title>
    <!-- BOOTSTRAP 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- ENCABEZADO DE EMERGENCIA -->
    <header class="bg-danger text-white text-center py-3 shadow sticky-top">
      <h2 class="mb-0 fw-bold">⚠️ PANEL DE CONTROL Y ALERTAS ⚠️</h2>
      <p class="mb-0">Uso exclusivo para el prestador del servicio</p>
    </header>

    <div class="container my-4">
      <div class="row g-4">
        <!-- ALERTA DEL DUEÑO -->
        <div class="col-lg-6">
          <div class="card border-danger shadow-sm h-100">
            <div class="card-header bg-danger text-white fw-bold">
              📢 Mensaje de Alerta del Dueño
            </div>
            <div class="card-body bg-danger bg-opacity-10">
              <p id="mostrar-alerta" class="fs-5 text-danger fw-bold mb-0">
                No hay alertas registradas.
              </p>
            </div>
          </div>
        </div>

        <!-- DATOS CLÍNICOS -->
        <div class="col-lg-6">
          <div class="card border-dark shadow-sm h-100">
            <div class="card-header bg-dark text-white fw-bold">
              📋 Ficha Clínica de la Mascota
            </div>
            <ul class="list-group list-group-flush" id="mostrar-datos">
              <!-- Se llena con JS -->
            </ul>
          </div>
        </div>
      </div>

      <!-- CUESTIONARIO DETALLADO PARA EL PRESTADOR -->
      <div class="card border-warning shadow-sm mt-4">
        <div class="card-header bg-warning text-dark fw-bold fs-5">
          📝 Evaluación de Riesgo (A completar por el Prestador)
        </div>
        <div class="card-body">
          <form id="prestador-form">
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold"
                  >Nivel de Riesgo del Servicio:</label
                >
                <select class="form-select border-dark" required>
                  <option value="">Seleccione...</option>
                  <option value="Bajo">Bajo (Mascota dócil)</option>
                  <option value="Medio">Medio (Requiere precaución)</option>
                  <option value="Alto">Alto (Posible reactividad)</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold"
                  >¿Requiere bozal o arnés de seguridad?</label
                >
                <select class="form-select border-dark" required>
                  <option value="">Seleccione...</option>
                  <option value="Si">Sí</option>
                  <option value="No">No</option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label fw-bold"
                  >¿Se deberá administrar medicación?</label
                >
                <select
                  class="form-select border-dark"
                  id="requiere-med"
                  required
                >
                  <option value="">Seleccione...</option>
                  <option value="Si">Sí</option>
                  <option value="No">No</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold"
                >Protocolo de Acción Preventiva:</label
              >
              <textarea
                class="form-control border-dark"
                rows="3"
                placeholder="Describe cómo vas a manejar la alerta informada por el dueño..."
                required
              ></textarea>
            </div>

            <div class="form-check mb-4">
              <input
                class="form-check-input border-dark"
                type="checkbox"
                id="checkSeguridad"
                required
              />
              <label class="form-check-label fw-bold" for="checkSeguridad">
                He leído la ficha, comprendo las alertas y asumo la
                responsabilidad del servicio.
              </label>
            </div>

            <button
              type="submit"
              class="btn btn-dark w-100 py-2 fw-bold fs-5 shadow"
            >
              Iniciar / Finalizar Servicio
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="alertas.js"></script>
  </body>
</html>
