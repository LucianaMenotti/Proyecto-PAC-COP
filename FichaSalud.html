<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha de Salud - Dueño</title>
    <link rel="stylesheet" href="fichasalud.css" />
  </head>
  <body>
    <div id="vista-dueno">
      <h1>🐾 Ficha de Salud</h1>
      <p>Completa esta ficha obligatoria antes de solicitar un servicio.</p>

      <form id="health-form">
        <fieldset>
          <legend>Datos Obligatorios</legend>
          <label for="raza">Raza:</label>
          <input type="text" id="raza" name="raza" required />

          <label for="edad">Edad (años):</label>
          <input type="number" id="edad" name="edad" required min="0" />

          <label for="condicion">Condición Médica:</label>
          <textarea id="condicion" name="condicion" required></textarea>

          <label for="alergias">Alergias:</label>
          <textarea id="alergias" name="alergias" required></textarea>

          <label for="vacunacion">Vacunación:</label>
          <select id="vacunacion" name="vacunacion" required>
            <option value="">Seleccione...</option>
            <option value="Completo">Completo</option>
            <option value="Incompleto">Incompleto</option>
            <option value="No vacunado">No vacunado</option>
          </select>

          <label for="reactividad">Reactividad:</label>
          <select id="reactividad" name="reactividad" required>
            <option value="">Seleccione...</option>
            <option value="Tranquilo">Tranquilo</option>
            <option value="Reactivo a otros perros">
              Reactivo a otros perros
            </option>
            <option value="Miedoso / Asustadizo">Miedoso / Asustadizo</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>⚠️ Alertas para el Prestador</legend>
          <label for="alerta-general"
            >¿Hay alguna alerta o indicación importante que el prestador deba
            saber?</label
          >
          <textarea
            id="alerta-general"
            name="alerta-general"
            placeholder="Ej: Toma medicación a las 18hs, muerde si se asusta, alergia al pollo..."
            required
          ></textarea>
        </fieldset>

        <button type="submit">Guardar Ficha y Solicitar Servicio</button>
      </form>
    </div>

    <script src="fichasalud.js"></script>
  </body>
</html>
