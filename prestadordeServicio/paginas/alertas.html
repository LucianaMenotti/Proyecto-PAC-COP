<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Alertas - Prestador</title>
    <!-- BOOTSTRAP 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- CSS PERSONALIZADO -->
    <link rel="stylesheet" href="../css/alertas.css" />
  </head>
  <body>
    <header class="header-app text-center py-3 sticky-top border-bottom">
      <h2 class="mb-0 fw-bold fs-4 text-dark">PANEL DE ALERTAS Y DECISIÓN</h2>
      <p class="mb-0 text-secondary small">
        Uso exclusivo para el prestador del servicio
      </p>
    </header>

    <div class="container my-4">
      <div class="row g-4">
        <!-- ALERTA DEL DUEÑO -->
        <div class="col-12 col-lg-6">
          <div class="card card-custom card-alert-danger h-100">
            <div class="card-header fw-bold">
              <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i
              >Mensaje de Alerta del Dueño
            </div>
            <div class="card-body d-flex align-items-center">
              <p id="mostrar-alerta" class="fs-5 fw-bold mb-0 text-dark">
                Cargando alertas...
              </p>
            </div>
          </div>
        </div>

        <!-- DATOS CLÍNICOS -->
        <div class="col-12 col-lg-6">
          <div class="card card-custom h-100">
            <div class="card-header header-blue fw-bold">
              <i class="bi bi-clipboard2-pulse-fill me-2"></i>Ficha Clínica de
              la Mascota
            </div>
            <ul class="list-group list-group-flush" id="mostrar-datos">
              <!-- Se llena con JS -->
            </ul>
          </div>
        </div>
      </div>

      <!-- DECISIÓN DEL PRESTADOR -->
      <div class="card card-custom mt-4">
        <div class="card-header header-blue fw-bold fs-5">
          Decisión del Prestador
        </div>
        <div class="card-body p-4 text-center">
          <p class="fs-6 text-dark fw-semibold mb-3">
            ¿Deseas aceptar o rechazar esta solicitud de servicio?
          </p>

          <!-- ACCIONES DIRECTAS -->
          <div
            class="d-flex flex-column flex-sm-row gap-3 justify-content-center"
          >
            <button
              type="button"
              id="btn-aceptar"
              class="btn btn-aceptar py-3 px-4 fw-bold flex-fill transition-btn"
            >
              <i class="bi bi-check-circle-fill me-2"></i>Aceptar Solicitud
            </button>
            <button
              type="button"
              id="btn-rechazar"
              class="btn btn-rechazar py-3 px-4 fw-bold flex-fill transition-btn"
            >
              <i class="bi bi-x-circle-fill me-2"></i>Rechazar Solicitud
            </button>
          </div>

          <!-- CONTENEDOR DESPLEGABLE PARA EL MOTIVO DE RECHAZO -->
          <div
            id="motivo-rechazo-container"
            class="mt-4 text-start p-3 rounded border bg-light"
            style="display: none"
          >
            <label
              for="motivo-rechazo"
              class="form-label fw-bold text-dark small"
            >
              Motivo del rechazo (Opcional):
            </label>
            <textarea
              class="form-control"
              id="motivo-rechazo"
              rows="2"
              placeholder="Explica brevemente por qué no puedes tomar este servicio..."
            ></textarea>
            <div class="d-flex gap-2 mt-3">
              <button
                type="button"
                id="btn-confirmar-rechazo"
                class="btn btn-danger-confirm w-100 py-2 fw-bold"
              >
                Confirmar Rechazo
              </button>
              <button
                type="button"
                id="btn-cancelar-rechazo"
                class="btn btn-outline-secondary w-100 py-2 fw-bold"
              >
                Cancelar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/alertas.js"></script>
  </body>
</html>
