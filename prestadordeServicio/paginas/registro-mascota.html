<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar mascota - Pac-Cop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">

</head>


<body>

    <nav class="navbar bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold text-primary" href="../index.html">
                Pac-Cop
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="form-container">

            <div class="text-center mb-4">

                <h1 class="fw-bold">
                    Registrar mascota
                </h1>

                <p class="text-secondary">
                    Agregá información básica de tu mascota.
                </p>

            </div>


            <form id="formMascota">

                <div class="mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text" id="nombreMascota" class="form-control" required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Especie
                    </label>

                    <select id="especie" class="form-select" required>

                        <option value="">
                            Seleccionar...
                        </option>

                        <option value="Perro">
                            Perro
                        </option>

                        <option value="Gato">
                            Gato
                        </option>

                        <option value="Tortuga">
                            Tortuga
                        </option>

                        <option value="Loro">
                            Loro
                        </option>

                        <option value="Conejo">
                            Conejo
                        </option>

                        <option value="Hámster">
                            Hámster
                        </option>

                        <option value="Pez">
                            Pez
                        </option>

                        <option value="Serpiente">
                            Serpiente
                        </option>
                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Raza
                    </label>

                    <input type="text" id="raza" class="form-control">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Edad
                    </label>

                    <input type="number" id="edad" class="form-control" min="0" required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea id="descripcion" class="form-control" rows="4"
                        placeholder="Contanos brevemente sobre tu mascota..."></textarea>

                </div>


                <button type="submit" class="btn btn-primary w-100">
                    Guardar mascota
                </button>

            </form>


            <div id="mensaje" class="mt-3"></div>

        </div>

    </main>


    <script src="../js/registro-mascota.js"></script>

</body>

</html>
