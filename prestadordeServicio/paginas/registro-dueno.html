<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro de dueño - Pac-Cop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="../index.html"
        >
            Pac-Cop
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h1 class="fw-bold">
                            Crear cuenta de dueño
                        </h1>

                        <p class="text-secondary">
                            Registrate para administrar tus mascotas
                            y contratar servicios.
                        </p>

                    </div>


                    <form id="formDueno">


                        <div class="row g-3">


                            <div class="col-md-6">

                                <label
                                    for="nombre"
                                    class="form-label"
                                >
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="apellido"
                                    class="form-label"
                                >
                                    Apellido
                                </label>

                                <input
                                    type="text"
                                    id="apellido"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="telefono"
                                    class="form-label"
                                >
                                    Teléfono
                                </label>

                                <input
                                    type="text"
                                    id="telefono"
                                    class="form-control"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="zona"
                                    class="form-label"
                                >
                                    Zona
                                </label>

                                <input
                                    type="text"
                                    id="zona"
                                    class="form-control"
                                    placeholder="Ej: Centro"
                                    required
                                >

                            </div>


                        </div>


                        <div
                            id="mensaje"
                            class="mt-4"
                        ></div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100 mt-3"
                        >
                            Crear cuenta
                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="../js/registro-dueno.js"></script>

</body>

</html>
