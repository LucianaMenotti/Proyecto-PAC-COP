<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis reservas · Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />

    <style>
      :root {
        --pac-primary: #1f7a74;
        --pac-primary-dark: #155551;
        --pac-accent: #ff6f52;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2c3e50;
        background: #f4fbf9;
      }
      .font-display { font-family: "Fraunces", serif; }
      .navbar-brand-pac {
        color: var(--pac-primary) !important;
        font-family: "Fraunces", serif;
        font-size: 1.5rem;
        font-weight: 700;
      }
      .text-primary-pac { color: var(--pac-primary) !important; }
      .btn-primary { background: var(--pac-primary); border-color: var(--pac-primary); }
      .btn-primary:hover { background: var(--pac-primary-dark); border-color: var(--pac-primary-dark); }
      .btn-outline-primary { color: var(--pac-primary); border-color: var(--pac-primary); }
      .btn-outline-primary:hover { background: var(--pac-primary); border-color: var(--pac-primary); }
      .reserva-card { border: 1px solid #e3efed; }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand navbar-brand-pac d-flex align-items-center gap-2" href="../index.html">
          <i class="bi bi-shield-fill-check fs-3"></i>
          <span>Pac-Cop</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarCuenta"
          aria-controls="navbarCuenta"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCuenta">
          <ul class="navbar-nav me-auto ms-lg-4 gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="buscar-prestadores.html">Buscar prestadores</a></li>
            <li class="nav-item"><a class="nav-link" href="mis-mascotas.html">Mis mascotas</a></li>
            <li class="nav-item"><a class="nav-link active" href="mis-servicios.html">Mis reservas</a></li>
          </ul>
          <div class="d-flex align-items-center gap-2 mt-3 mt-lg-0">
            <button type="button" class="btn btn-outline-primary btn-sm rounded-pill px-3" id="cerrarSesion">
              <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
          <h1 class="font-display fw-bold mb-1">Mis reservas</h1>
          <p class="text-secondary mb-0">Gestioná tus reservas, seguí el servicio y dejá tu reseña.</p>
        </div>
        <div class="d-flex gap-2">
          <select class="form-select" id="filtroEstado" aria-label="Filtrar por estado">
            <option value="">Todos los estados</option>
            <option value="programado">Pendiente de confirmación</option>
            <option value="aceptado">Aceptada</option>
            <option value="en-curso">En curso</option>
            <option value="finalizado">Finalizada</option>
            <option value="cancelado">Cancelada</option>
            <option value="rechazado">Rechazada</option>
          </select>
        </div>
      </div>

      <div id="alerta" class="d-none"></div>

      <div class="row g-4" id="reservas">
        <div class="col-12 text-center text-secondary py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 mb-0">Cargando reservas...</p>
        </div>
      </div>
    </main>

    <div class="modal fade" id="modalCancelar" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Cancelar reserva</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <p class="text-secondary small">
              Si cancelás con al menos 12 horas de anticipación, el pago se reembolsa por completo.
            </p>
            <label for="motivoCancelacion" class="form-label">Motivo (opcional)</label>
            <textarea class="form-control" id="motivoCancelacion" rows="3" maxlength="255"></textarea>
            <div class="text-danger small mt-2 d-none" id="errorCancelar"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Volver</button>
            <button type="button" class="btn btn-danger" id="confirmarCancelar">Cancelar reserva</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="modalCalificar" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Calificar servicio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="puntuacion" class="form-label">Puntuación</label>
              <select class="form-select" id="puntuacion">
                <option value="5">5 - Excelente</option>
                <option value="4">4 - Muy bueno</option>
                <option value="3">3 - Bueno</option>
                <option value="2">2 - Regular</option>
                <option value="1">1 - Malo</option>
              </select>
            </div>
            <div class="mb-2">
              <label for="comentarioResena" class="form-label">Comentario (opcional)</label>
              <textarea class="form-control" id="comentarioResena" rows="3" maxlength="500"></textarea>
            </div>
            <div class="text-danger small d-none" id="errorCalificar"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
            <button type="button" class="btn btn-primary" id="confirmarCalificar">Enviar reseña</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../js/mis-servicios.js"></script>
  </body>
</html>
