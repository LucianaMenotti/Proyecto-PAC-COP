<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro de prestador - PetCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/styles.css">

</head>


<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="../index.html"
        >
            Pac-Cop
        </a>

    </div>

</nav>


<main class="container">

    <div class="form-container">

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                Registro de prestador
            </h1>

            <p class="text-secondary">
                Creá tu cuenta y comenzá a ofrecer tus servicios.
            </p>

        </div>


        <form id="formPrestador">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        required
                    >

                </div>


                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        required
                    >

                </div>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Teléfono
                </label>

                <input
                    type="tel"
                    class="form-control"
                    id="telefono"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Zona donde trabaja
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="zona"
                    placeholder="Ej: Centro, Liborsi..."
                    required
                >

            </div>


<div class="mb-4">

    <label class="form-label">
        Servicios ofrecidos
    </label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            value="Paseo"
            id="paseo"
        >

        <label
            class="form-check-label"
            for="paseo"
        >
            Paseo de mascotas
        </label>

    </div>


    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            value="Guarderia"
            id="guarderia"
        >

        <label
            class="form-check-label"
            for="guarderia"
        >
            Guardería de mascotas
        </label>

    </div>


    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            value="Traslado"
            id="traslado"
        >

        <label
            class="form-check-label"
            for="traslado"
        >
            Traslado de mascotas
        </label>

    </div>

</div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Crear cuenta
            </button>

        </form>


        <div
            id="mensaje"
            class="mt-3"
        ></div>

    </div>

</main>


<script src="../js/registro.js"></script>

</body>
</html>
