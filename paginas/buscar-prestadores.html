<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buscar prestadores - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
          Pac-Cop
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Buscar prestadores</h1>

        <p class="text-secondary">
          Encontrá el servicio que tu mascota necesita.
        </p>
      </div>

      <!-- FILTROS -->

      <div class="card border-0 shadow-sm mb-5">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label"> Servicio </label>

              <select id="filtroServicio" class="form-select">
                <option value="">Todos</option>

                <option value="Paseo">Paseo</option>

                                <option value="Guarderia">Guarderia</option>

                <option value="Traslado">Traslado</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label"> Zona </label>

              <input
                type="text"
                id="filtroZona"
                class="form-control"
                placeholder="Ej: Centro"
              />
            </div>

            <div class="col-md-4">
              <label class="form-label"> Buscar </label>

              <button id="btnBuscar" class="btn btn-primary w-100">
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- RESULTADOS -->

      <div id="resultados" class="row g-4"></div>
    </main>

    
    <!-- MODAL DE RESERVA -->

    <div class="modal fade" id="modalReserva" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <form id="formReserva" class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloReserva">Reservar servicio</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="reservaServicio">Servicio</label>
              <select id="reservaServicio" class="form-select" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="reservaMascota">Mascota</label>
              <select id="reservaMascota" class="form-select" required></select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="reservaFecha">Fecha y hora</label>
              <input type="datetime-local" id="reservaFecha" class="form-control" required />
            </div>

            <div id="trasladoDatos" class="d-none">
              <div class="mb-3">
                <label class="form-label" for="trasladoOrigen">Dirección de origen</label>
                <input id="trasladoOrigen" type="text" class="form-control" autocomplete="off" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="trasladoDestino">Dirección de destino</label>
                <input id="trasladoDestino" type="text" class="form-control" autocomplete="off" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="trasladoMotivo">Motivo</label>
                <select id="trasladoMotivo" class="form-select">
                  <option value="">Sin especificar</option>
                  <option value="queda">Vuelta de un servicio (guardería)</option>
                  <option value="viaje">Traslado puntual</option>
                  <option value="mudanza">Cambio de domicilio</option>
                </select>
              </div>
              <div id="vueltaDatos" class="d-none">
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" id="solicitarVuelta" />
                  <label class="form-check-label" for="solicitarVuelta">
                    Solicitar también la vuelta de la mascota
                  </label>
                </div>
                <label class="form-label small" for="horaRegreso">Fecha y hora de regreso</label>
                <input type="datetime-local" id="horaRegreso" class="form-control" />
              </div>
            </div>

            <p class="mb-0">Precio: <strong id="reservaPrecio">-</strong></p>

            <div id="reservaError" class="alert alert-danger d-none mt-3 mb-0"></div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Confirmar reserva</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL DE RESEÑAS -->

    <div class="modal fade" id="modalResenas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="tituloResenas">Reseñas</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body" id="listaResenas"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/prestadores.js"></script>
  </body>
</html>
