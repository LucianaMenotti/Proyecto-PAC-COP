<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Buscar prestadores - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
          Pac-Cop
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Buscar prestadores</h1>

        <p class="text-secondary">
          Encontrá el servicio que tu mascota necesita.
        </p>
      </div>

      <!-- FILTROS -->

      <div class="card border-0 shadow-sm mb-5">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label"> Servicio </label>

              <select id="filtroServicio" class="form-select">
                <option value="">Todos</option>

                <option value="Paseo">Paseo</option>

                <option value="Cuidado">Guarderia</option>

                <option value="Traslado">Traslado</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label"> Zona </label>

              <input
                type="text"
                id="filtroZona"
                class="form-control"
                placeholder="Ej: Centro"
              />
            </div>

            <div class="col-md-4">
              <label class="form-label"> Buscar </label>

              <button id="btnBuscar" class="btn btn-primary w-100">
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- RESULTADOS -->

      <div id="resultados" class="row g-4"></div>
    </main>

    <script src="../js/prestadores.js"></script>
  </body>
</html>
