<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Perfil del prestador - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
          Pac-Cop
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div id="perfil"></div>
    </main>

    <script>
      const contenedor = document.getElementById("perfil");

      const parametros = new URLSearchParams(window.location.search);

      const id = parametros.get("id");

      async function cargarPerfil() {
        if (!id) {
          contenedor.innerHTML = `
            <div class="alert alert-danger">
                Prestador no encontrado.
            </div>
        `;

          return;
        }

        try {
          const respuesta = await fetch(`/api/users/${id}`);

          const prestador = await respuesta.json();

          if (!respuesta.ok) {
            contenedor.innerHTML = `
                <div class="alert alert-danger">
                    ${prestador.mensaje}
                </div>
            `;

            return;
          }

          const servicios = prestador.servicios || [];

          contenedor.innerHTML = `

            <div class="profile-header p-4 mb-4">

                <div class="row align-items-center">

                    <div class="col-md-3 text-center">
                    </div>

                    <div class="col-md-9">

                        <h1 class="fw-bold">
                            ${prestador.nombre}
                            ${prestador.apellido}
                        </h1>

                        ${
                          prestador.verificado
                            ? `
                            <span class="badge text-bg-success">
                                ✓ Identidad verificada
                            </span>
                            `
                            : ""
                        }

                        <p class="mt-3 mb-1">

                            <strong>
                                ${prestador.calificacion || 0}
                            </strong>

                            (${prestador.resenas || 0} reseñas)

                        </p>

                        <p class="text-secondary">
                            ${prestador.zona}
                        </p>

                    </div>

                </div>

            </div>


            <div class="row g-4">

                <div class="col-lg-8">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body p-4">

                            <h3>
                                Sobre mí
                            </h3>

                            <p class="text-secondary">
                                Prestador registrado en Pac-Cop.
                                Podés consultar los servicios disponibles
                                y solicitar uno desde esta página.
                            </p>


                            <h3 class="mt-4">
                                Servicios
                            </h3>


                            <div class="d-flex flex-wrap gap-2">

                                ${
                                  servicios.length > 0
                                    ? servicios
                                        .map(function (servicio) {
                                          return `
                                                <span class="badge text-bg-primary">
                                                    ${servicio}
                                                </span>
                                            `;
                                        })
                                        .join("")
                                    : `
                                        <span class="text-secondary">
                                            No tiene servicios registrados.
                                        </span>
                                    `
                                }

                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-lg-4">

                    <div class="card border-0 shadow-sm">

                        <div class="card-body p-4">

                            <h4>
                                ¿Te interesa este prestador?
                            </h4>

                            <p class="text-secondary">
                                Podés solicitar uno de sus servicios.
                            </p>

                            <button
                                id="btnSolicitar"
                                class="btn btn-primary w-100"
                            >
                                Solicitar servicio
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        `;

          document
            .getElementById("btnSolicitar")
            .addEventListener("click", function () {
              alert("Esta funcionalidad estará disponible próximamente.");
            });
        } catch (error) {
          console.error("Error:", error);

          contenedor.innerHTML = `
            <div class="alert alert-danger">
                No se pudo conectar con el servidor.
            </div>
        `;
        }
      }

      cargarPerfil();
    </script>
  </body>
</html>
