<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil del prestador - PetCare</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/styles.css">

</head>


<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="../index.html"
        >
            Pac-Cop
        </a>

    </div>

</nav>


<main class="container py-5">

    <div id="perfil"></div>

</main>


<script>

const prestadores = [

    {
        id: 1,
        nombre: "Nahuel González",
        zona: "Liborsi",
        servicios: ["Paseo", "Cuidado"],
        calificacion: 4.8,
        reseñas: 24,
        verificado: true,
        descripcion:
            "Me dedico al cuidado y paseo de mascotas. Me gusta trabajar de manera responsable y brindar tranquilidad a los dueños."
    },

    {
        id: 2,
        nombre: "María López",
        zona: "Centro",
        servicios: ["Paseo", "Baño"],
        calificacion: 4.6,
        reseñas: 18,
        verificado: true,
        descripcion:
            "Ofrezco servicios de paseo y cuidado básico de mascotas."
    },

    {
        id: 3,
        nombre: "Lucas Fernández",
        zona: "San Martín",
        servicios: ["Cuidado"],
        calificacion: 4.9,
        reseñas: 31,
        verificado: true,
        descripcion:
            "Me especializo en acompañamiento y cuidado de mascotas."
    }

];


const parametros =
    new URLSearchParams(window.location.search);


const id =
    Number(parametros.get("id"));


const prestador =
    prestadores.find(function(item) {

        return item.id === id;

    });


const contenedor =
    document.getElementById("perfil");


if (!prestador) {

    contenedor.innerHTML = `

        <div class="alert alert-danger">

            Prestador no encontrado.

        </div>

    `;

} else {

    contenedor.innerHTML = `

        <div class="profile-header p-4 mb-4">

            <div class="row align-items-center">

                <div class="col-md-3 text-center">

                </div>


                <div class="col-md-9">

                    <h1 class="fw-bold">
                        ${prestador.nombre}
                    </h1>


                    ${
                        prestador.verificado
                        ?
                        `
                        <span class="badge text-bg-success">
                            ✓ Identidad verificada
                        </span>
                        `
                        :
                        ""
                    }


                    <p class="mt-3 mb-1">

                        
                        <strong>
                            ${prestador.calificacion}
                        </strong>

                        (${prestador.reseñas} reseñas)

                    </p>


                    <p class="text-secondary">

                        ${prestador.zona}

                    </p>

                </div>

            </div>

        </div>


        <div class="row g-4">

            <div class="col-lg-8">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h3>
                            Sobre mí
                        </h3>

                        <p class="text-secondary">
                            ${prestador.descripcion}
                        </p>


                        <h3 class="mt-4">
                            Servicios
                        </h3>


                        <div class="d-flex flex-wrap gap-2">

                            ${prestador.servicios
                                .map(function(servicio) {

                                    return `
                                        <span class="badge text-bg-primary">
                                            ${servicio}
                                        </span>
                                    `;

                                })
                                .join("")
                            }

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-lg-4">

                <div class="card border-0 shadow-sm">

                    <div class="card-body p-4">

                        <h4>
                            ¿Te interesa este prestador?
                        </h4>

                        <p class="text-secondary">
                            Podés solicitar uno de sus servicios.
                        </p>

                        <button
                            class="btn btn-primary w-100"
                            onclick="solicitarServicio()"
                        >
                            Solicitar servicio
                        </button>

                    </div>

                </div>

            </div>

        </div>

    `;

}


function solicitarServicio() {

    alert(
        "Esta funcionalidad estará disponible próximamente."
    );

}

</script>


</body>
</html>
