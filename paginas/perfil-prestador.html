<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi perfil - Pac-Cop</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar bg-white shadow-sm border-bottom">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="../index.html"
        >
            Pac-Cop
        </a>


        <a
            href="panel-prestador.html"
            class="btn btn-outline-primary"
        >
            Volver al panel
        </a>

    </div>

</nav>



<!-- CONTENIDO -->

<main class="container py-5">

    <div id="perfil">

        <div class="text-center text-secondary">

            Cargando perfil...

        </div>

    </div>

</main>



<script>


// =========================================
// USUARIO LOGUEADO
// =========================================

const usuarioGuardado =
    localStorage.getItem("usuario");


const contenedor =
    document.getElementById("perfil");


// -----------------------------------------
// COMPROBAR SESIÓN
// -----------------------------------------

if (!usuarioGuardado) {

    window.location.href =
        "login.html";

} else {

    try {

        const usuario =
            JSON.parse(usuarioGuardado);


        // ---------------------------------
        // COMPROBAR QUE SEA PRESTADOR
        // ---------------------------------

        if (usuario.rol !== "prestador") {

            contenedor.innerHTML = `

                <div class="alert alert-danger">

                    Esta página es solamente
                    para prestadores.

                </div>

            `;

        } else {

            mostrarPerfil(usuario);

        }


    } catch (error) {

        console.error(
            "Error al leer el usuario:",
            error
        );

        localStorage.removeItem("usuario");

        window.location.href =
            "login.html";

    }

}



// =========================================
// MOSTRAR PERFIL
// =========================================

function mostrarPerfil(usuario) {


    // -------------------------------------
    // SERVICIOS
    // -------------------------------------

    let servicios = [];


    if (Array.isArray(usuario.servicios)) {

        servicios =
            usuario.servicios;

    }

    else if (
        typeof usuario.servicios === "string"
    ) {

        try {

            servicios =
                JSON.parse(usuario.servicios);

        } catch (error) {

            servicios = [];

        }

    }


    // -------------------------------------
    // NOMBRE
    // -------------------------------------

    const nombreCompleto =
        `${usuario.nombre || ""} ${usuario.apellido || ""}`.trim();


    // -------------------------------------
    // INICIAL
    // -------------------------------------

    const inicial =
        usuario.nombre
            ? usuario.nombre.charAt(0).toUpperCase()
            : "P";


    // -------------------------------------
    // SERVICIOS HTML
    // -------------------------------------

    const serviciosHTML =
        servicios.length > 0

        ?

        servicios
            .map(function(servicio) {

                return `

                    <span class="badge text-bg-primary">

                        ${servicio}

                    </span>

                `;

            })
            .join("")

        :

        `

            <span class="text-secondary">

                No tenés servicios registrados.

            </span>

        `;



    // =====================================
    // PERFIL
    // =====================================

    contenedor.innerHTML = `


        <!-- ENCABEZADO -->

        <div class="card border-0 shadow-sm mb-4">

            <div class="card-body p-4">


                <div
                    class="row align-items-center g-4"
                >


                    <!-- AVATAR -->

                    <div class="col-md-3 text-center">

                        <div
                            class="avatar mx-auto"
                            style="
                                width: 90px;
                                height: 90px;
                                font-size: 2rem;
                            "
                        >

                            ${inicial}

                        </div>

                    </div>



                    <!-- DATOS -->

                    <div class="col-md-9">


                        <h1 class="fw-bold mb-2">

                            ${nombreCompleto}

                        </h1>


                        ${
                            usuario.verificado

                            ?

                            `

                                <span
                                    class="badge text-bg-success"
                                >

                                    ✓ Identidad verificada

                                </span>

                            `

                            :

                            `

                                <span
                                    class="badge text-bg-secondary"
                                >

                                    Identidad no verificada

                                </span>

                            `
                        }


                        <p class="mt-3 mb-1">

                            <strong>

                                ${usuario.calificacion || 0}

                            </strong>

                            ★

                            <span class="text-secondary">

                                (${usuario.resenas || 0}
                                reseñas)

                            </span>

                        </p>


                        <p class="text-secondary mb-0">

                            📍 ${usuario.zona || "Zona no especificada"}

                        </p>


                    </div>


                </div>


            </div>

        </div>
        <!-- INFORMACIÓN -->
        <div class="row g-4">
            <!-- SOBRE MÍ -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="fw-bold">
                            Sobre mí

                        </h3>


                        <p class="text-secondary">

                            Prestador registrado
                            en Pac-Cop.

                        </p>



                        <!-- SERVICIOS -->

                        <h3 class="fw-bold mt-4">

                            Mis servicios

                        </h3>


                        <div
                            class="d-flex flex-wrap gap-2 mt-3"
                        >

                            ${serviciosHTML}

                        </div>


                    </div>

                </div>

            </div>
            <!-- INFORMACIÓN DE CUENTA -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold">
                            Mi cuenta
                        </h4>
                        <hr>
                        <p class="mb-2">

                            <strong>
                                Correo
                            </strong>

                        </p>

                        <p class="text-secondary">

                            ${usuario.email}

                        </p>



                        <p class="mb-2">

                            <strong>
                                Teléfono
                            </strong>

                        </p>

                        <p class="text-secondary">

                            ${usuario.telefono || "No especificado"}

                        </p>



                        <p class="mb-2">

                            <strong>
                                Zona
                            </strong>

                        </p>

                        <p class="text-secondary">

                            ${usuario.zona || "No especificada"}

                        </p>



                        <button
                            id="btnEditar"
                            class="btn btn-primary w-100 mt-3"
>
                            Editar perfil
                        </button>
                    </div>

                </div>

            </div>


        </div>


    `;



    // =====================================
    // BOTÓN EDITAR
    // =====================================

    const btnEditar =
        document.getElementById("btnEditar");


    if (btnEditar) {

        btnEditar.addEventListener(
            "click",
            function() {

                alert(
                    "La edición del perfil estará disponible próximamente."
                );

            }
        );

    }

}


</script>


</body>

</html>
