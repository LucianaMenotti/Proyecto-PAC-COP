<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestión de reclamos - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="inicio.html">
          Pac-Cop
        </a>

        <div class="d-flex gap-2">
          <a href="notificaciones.html" class="btn btn-outline-primary">
            Notificaciones
            <span
              class="badge bg-danger rounded-pill d-none"
              data-contador-notificaciones
              >0</span
            >
          </a>

          <a href="inicio.html" class="btn btn-outline-primary"> Volver </a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
      >
        <h1 class="fw-bold mb-0">Gestión de reclamos</h1>

        <div class="d-flex gap-2">
          <select id="filtroEstado" class="form-select">
            <option value="">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="en-revision">En revisión</option>
            <option value="finalizado">Finalizado</option>
          </select>

          <button
            type="button"
            class="btn btn-outline-primary"
            id="btnActualizar"
          >
            Actualizar
          </button>
        </div>
      </div>

      <div id="mensajeCarga" class="text-center text-secondary">
        Cargando reclamos...
      </div>

      <div id="mensajeVacio" class="alert alert-info d-none">
        No hay reclamos para mostrar.
      </div>

      <div id="mensajeError" class="alert alert-danger d-none"></div>

      <div id="listaReclamos" class="row g-4"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../js/admin-reclamos.js"></script>
  </body>
</html>
