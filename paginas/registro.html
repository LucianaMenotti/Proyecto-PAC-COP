<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrarse - Pac-Cop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

</head>


<body>

<nav class="navbar bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold text-primary"
            href="../index.html"
        >
            Pac-Cop
        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Creá tu cuenta
        </h1>

        <p class="text-secondary">
            Elegí qué tipo de cuenta querés crear.
        </p>

    </div>


    <div class="row justify-content-center g-4">


        <!-- DUEÑO -->

        <div class="col-md-5">

            <div
                class="card h-100 border-0 shadow-sm text-center p-4"
            >

                <h3 class="mt-3">
                    Dueño de mascota/s
                </h3>

                <p class="text-secondary">
                    Quiero encontrar y contratar servicios
                    para mis mascotas.
                </p>

                <a
                    href="registro-dueno.html"
                    class="btn btn-primary mt-auto"
                >
                    Crear cuenta
                </a>

            </div>

        </div>


        <!-- PRESTADOR -->

        <div class="col-md-5">

            <div
                class="card h-100 border-0 shadow-sm text-center p-4"
            >

                <h3 class="mt-3">
                    Prestador
                </h3>

                <p class="text-secondary">
                    Quiero ofrecer mis servicios para
                    mascotas.
                </p>

                <a
                    href="registro-prestador.html"
                    class="btn btn-outline-primary mt-auto"
                >
                    Crear cuenta
                </a>

            </div>

        </div>


    </div>

</main>

</body>

</html>
