<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración - Pac-Cop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/styles.css">

</head>


<body class="bg-soft-pac">

<nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">

    <div class="container">

        <a
            class="navbar-brand navbar-brand-pac d-flex align-items-center gap-2"
            href="../index.html"
        >
            <i class="bi bi-shield-fill-check fs-3"></i>
            <span>Pac-Cop</span>
        </a>

        <div class="d-flex align-items-center gap-2">
            <a href="inicio.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Mi cuenta
            </a>
            <button
                type="button"
                class="btn btn-outline-primary btn-sm rounded-pill px-3"
                id="cerrarSesion"
            >
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </div>

    </div>

</nav>


<main class="container py-4 py-lg-5">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">

        <div>
            <h1 class="font-display fw-bold mb-1">
                Panel de administración
            </h1>
            <p class="text-secondary mb-0">
                Métricas, usuarios y moderación de servicios.
            </p>
        </div>

        <span class="badge bg-white text-primary-pac border px-3 py-2 rounded-pill">
            <i class="bi bi-shield-check me-1"></i> Rol administrador
        </span>

    </div>


    <section class="row g-3 mb-4" id="resumen">

        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-1">Usuarios</p>
                    <p class="fs-3 fw-bold mb-0" id="rUsuarios">-</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-1">Prestadores</p>
                    <p class="fs-3 fw-bold mb-0" id="rPrestadores">-</p>
                    <small class="text-success" id="rVerificados">-</small>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-1">Servicios</p>
                    <p class="fs-3 fw-bold mb-0" id="rServicios">-</p>
                    <small class="text-secondary" id="rEnCurso">-</small>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <p class="text-secondary small mb-1">Pagos retenidos</p>
                    <p class="fs-3 fw-bold mb-0" id="rRetenidos">-</p>
                    <small class="text-secondary" id="rRecaudado">-</small>
                </div>
            </div>
        </div>

    </section>


    <ul class="nav nav-pills gap-2 mb-3" role="tablist">

        <li class="nav-item" role="presentation">
            <button
                class="nav-link active rounded-pill"
                data-bs-toggle="pill"
                data-bs-target="#tabUsuarios"
                type="button"
            >
                Usuarios
            </button>
        </li>

        <li class="nav-item" role="presentation">
            <button
                class="nav-link rounded-pill"
                data-bs-toggle="pill"
                data-bs-target="#tabServicios"
                type="button"
            >
                Servicios
            </button>
        </li>

    </ul>


    <div class="tab-content">

        <div class="tab-pane fade show active" id="tabUsuarios">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <div class="row g-2 mb-3">

                        <div class="col-md-6">
                            <input
                                type="search"
                                class="form-control"
                                id="buscarUsuario"
                                placeholder="Buscar por nombre, email o DNI"
                            >
                        </div>

                        <div class="col-md-3">
                            <select class="form-select" id="filtroRol">
                                <option value="">Todos los roles</option>
                                <option value="dueño">Dueño</option>
                                <option value="prestador">Prestador</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <select class="form-select" id="filtroVerificado">
                                <option value="">Verificación</option>
                                <option value="true">Verificados</option>
                                <option value="false">Sin verificar</option>
                            </select>
                        </div>

                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Verificado</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="usuariosBody"></tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <button class="btn btn-outline-secondary btn-sm" id="usuPrev" type="button">Anterior</button>
                        <span class="small text-secondary" id="usuInfo"></span>
                        <button class="btn btn-outline-secondary btn-sm" id="usuNext" type="button">Siguiente</button>
                    </div>

                </div>

            </div>

        </div>


        <div class="tab-pane fade" id="tabServicios">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <div class="row g-2 mb-3">

                        <div class="col-md-4">
                            <select class="form-select" id="filtroEstadoServicio">
                                <option value="">Todos los estados</option>
                                <option value="programado">Programado</option>
                                <option value="aceptado">Aceptado</option>
                                <option value="en-curso">En curso</option>
                                <option value="finalizado">Finalizado</option>
                                <option value="cancelado">Cancelado</option>
                                <option value="rechazado">Rechazado</option>
                            </select>
                        </div>

                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Servicio</th>
                                    <th>Dueño</th>
                                    <th>Prestador</th>
                                    <th>Monto</th>
                                    <th>Estado</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="serviciosBody"></tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <button class="btn btn-outline-secondary btn-sm" id="servPrev" type="button">Anterior</button>
                        <span class="small text-secondary" id="servInfo"></span>
                        <button class="btn btn-outline-secondary btn-sm" id="servNext" type="button">Siguiente</button>
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notificaciones.js"></script>
<script src="../js/admin.js"></script>

</body>

</html>
