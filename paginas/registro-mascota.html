<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registrar mascota - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="../index.html">
          Pac-Cop
        </a>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
              <div class="text-center mb-4">
                <h1 class="fw-bold">Registrar mascota</h1>

                <p class="text-secondary">Agregá información de tu mascota.</p>
              </div>

              <form id="formMascota">
                <!-- ========================= -->
                <!-- DATOS DE LA MASCOTA -->
                <!-- ========================= -->

                <h4 class="mb-3">Datos de la mascota</h4>

                <div class="mb-3">
                  <label for="nombreMascota" class="form-label"> Nombre </label>

                  <input
                    type="text"
                    id="nombreMascota"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="especie" class="form-label"> Especie </label>

                  <select id="especie" class="form-select" required>
                    <option value="">Seleccionar...</option>

                    <option value="Perro">Perro</option>

                    <option value="Gato">Gato</option>

                    <option value="Tortuga">Tortuga</option>

                    <option value="Loro">Loro</option>

                    <option value="Conejo">Conejo</option>

                    <option value="Hámster">Hámster</option>

                    <option value="Pez">Pez</option>

                    <option value="Serpiente">Serpiente</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label for="raza" class="form-label"> Raza </label>

                  <input type="text" id="raza" class="form-control" />
                </div>

                <div class="mb-3">
                  <label for="edad" class="form-label"> Edad </label>

                  <input
                    type="number"
                    id="edad"
                    class="form-control"
                    min="0"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="descripcion" class="form-label">
                    Descripción
                  </label>

                  <textarea
                    id="descripcion"
                    class="form-control"
                    rows="3"
                    placeholder="Contanos brevemente sobre tu mascota..."
                  ></textarea>
                </div>

                <hr class="my-4" />

                <!-- ========================= -->
                <!-- FICHA DE SALUD -->
                <!-- ========================= -->

                <h4 class="mb-3">Ficha de salud</h4>

                <p class="text-secondary">
                  Es opcional. Podés completarla ahora o hacerlo más adelante.
                </p>

                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="fichaSalud"
                    id="fichaAhora"
                    value="si"
                  />

                  <label class="form-check-label" for="fichaAhora">
                    Quiero completar la ficha de salud ahora
                  </label>
                </div>

                <div class="form-check mb-3">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="fichaSalud"
                    id="fichaDespues"
                    value="no"
                    checked
                  />

                  <label class="form-check-label" for="fichaDespues">
                    La completaré más adelante
                  </label>
                </div>

                <div id="datosSalud" class="d-none">
                  <div class="mb-3">
                    <label for="condicion" class="form-label">
                      Condición médica
                    </label>

                    <textarea
                      id="condicion"
                      class="form-control"
                      rows="2"
                      placeholder="Indicá si tiene alguna condición médica"
                    ></textarea>
                  </div>

                  <div class="mb-3">
                    <label for="alergias" class="form-label"> Alergias </label>

                    <textarea
                      id="alergias"
                      class="form-control"
                      rows="2"
                      placeholder="Indicá si tiene alguna alergia"
                    ></textarea>
                  </div>

                  <div class="mb-3">
                    <label for="vacunacion" class="form-label">
                      Vacunación
                    </label>

                    <select id="vacunacion" class="form-select">
                      <option value="">Seleccione...</option>

                      <option value="Completo">Completo</option>

                      <option value="Incompleto">Incompleto</option>

                      <option value="No vacunado">No vacunado</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="reactividad" class="form-label">
                      Reactividad
                    </label>

                    <select id="reactividad" class="form-select">
                      <option value="">Seleccione...</option>

                      <option value="Tranquilo">Tranquilo</option>

                      <option value="Reactivo a otros perros">
                        Reactivo a otros perros
                      </option>

                      <option value="Miedoso / Asustadizo">
                        Miedoso / Asustadizo
                      </option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="alertaGeneral" class="form-label">
                      Alertas para el prestador
                    </label>

                    <textarea
                      id="alertaGeneral"
                      class="form-control"
                      rows="3"
                      placeholder="Ej: Toma medicación a las 18 hs, necesita evitar ciertos alimentos..."
                    ></textarea>
                  </div>
                </div>

                <div id="mensaje" class="mt-4"></div>

                <button type="submit" class="btn btn-primary w-100 mt-3">
                  Guardar mascota
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/registro-mascota.js"></script>
  </body>
</html>
