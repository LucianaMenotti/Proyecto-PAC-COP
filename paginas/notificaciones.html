<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notificaciones - Pac-Cop</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <nav class="navbar bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="inicio.html">
          Pac-Cop
        </a>

        <a href="inicio.html" class="btn btn-outline-primary"> Volver </a>
      </div>
    </nav>

    <main class="container py-5" style="max-width: 800px">
      <div
        class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"
      >
        <h1 class="fw-bold mb-0">Notificaciones</h1>

        <button type="button" class="btn btn-outline-primary" id="btnLeerTodas">
          Marcar todas como leídas
        </button>
      </div>

      <div id="mensajeCarga" class="text-center text-secondary">
        Cargando notificaciones...
      </div>

      <div id="mensajeVacio" class="alert alert-info d-none">
        No tenés notificaciones.
      </div>

      <div id="mensajeError" class="alert alert-danger d-none"></div>

      <div id="listaNotificaciones"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script type="module" src="../js/notificaciones.js"></script>
  </body>
</html>
